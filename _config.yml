title: Citadel Cloud Management
tagline: "100+ Production Terraform Guides — AWS, Azure, GCP"
description: >-
  Free production-ready Terraform guides for AWS, Azure, GCP, Kubernetes, EKS, AKS, GKE,
  DevSecOps, AI/ML Engineering, MCP Servers, and Cloud Careers. 100+ articles, MIT licensed,
  no paywall. Built for cloud engineers, platform engineers, and DevOps teams.

url: "https://kogunlowo123.github.io"
baseurl: "/citadel-cloud-management"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

lang: en_US

author:
  name: Citadel Cloud Management
  email: citadelcloudmanagement@gmail.com
  url: https://citadelcloudmanagement.com

social:
  name: Citadel Cloud Management
  links:
    - https://github.com/kogunlowo123/citadel-cloud-management
    - https://www.citadelcloudmanagement.com

twitter:
  username: citadelcloud
  card: summary_large_image

feed:
  path: feed.xml

sitemap:
  exclude:
    - /404.html

collections:
  articles:
    output: true
    permalink: /articles/:name

defaults:
  - scope:
      path: "citadel-content/blog"
    values:
      layout: post
      author: Citadel Cloud Management

nav_links:
  - title: "AWS"
    url: "/aws"
  - title: "Azure"
    url: "/azure"
  - title: "GCP"
    url: "/gcp"
  - title: "MCP Servers"
    url: "/mcp"
  - title: "DevSecOps"
    url: "/devsecops"
  - title: "AI/ML"
    url: "/aiml"
  - title: "Careers"
    url: "/careers"
  - title: "GitHub"
    url: "https://github.com/kogunlowo123/citadel-cloud-management"

minima:
  skin: auto
  social_links:
    - { platform: github, user_url: "https://github.com/kogunlowo123/citadel-cloud-management" }
    - { platform: twitter, user_url: "https://twitter.com/citadelcloud" }
