name: Growth Monitor

on:
  schedule:
    # 3:47pm CDT = 20:47 UTC
    - cron: '47 20 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email report'
        required: false
        default: 'true'
        type: boolean

jobs:
  daily-monitor:
    name: Daily Growth Monitor
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gather content metrics
        id: metrics
        run: |
          BLOG_COUNT=$(find citadel-content/blog -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          PIPELINE_COUNT=$(find articles -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          SOCIAL_COUNT=$(find citadel-content/social-media -name "distribution-batch-*.md" 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$((BLOG_COUNT + PIPELINE_COUNT))
          DATE=$(TZ='America/Chicago' date +%Y-%m-%d)
          TIME=$(TZ='America/Chicago' date +%H:%M)

          echo "blog_count=$BLOG_COUNT" >> $GITHUB_OUTPUT
          echo "pipeline_count=$PIPELINE_COUNT" >> $GITHUB_OUTPUT
          echo "social_count=$SOCIAL_COUNT" >> $GITHUB_OUTPUT
          echo "total_articles=$TOTAL" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT

          echo "Blog articles: $BLOG_COUNT (target: 100)"
          echo "Pipeline articles: $PIPELINE_COUNT"
          echo "Social batches: $SOCIAL_COUNT"
          echo "Total: $TOTAL"

          echo "## Growth Monitor — $DATE $TIME CDT" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Blog articles | $BLOG_COUNT | 100 |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline articles | $PIPELINE_COUNT | 20 |" >> $GITHUB_STEP_SUMMARY
          echo "| Social batches | $SOCIAL_COUNT | 10 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** | **100** |" >> $GITHUB_STEP_SUMMARY

      - name: Check pillar gaps
        id: pillars
        run: |
          gaps=""
          for pillar in "aws\|eks\|vpc\|rds\|lambda" "azure\|aks\|key.vault" "gke\|gcp\|vertex" "mcp" "multi-cloud\|landing.zone" "bedrock\|ai\|agent\|rag" "security\|waf\|guardduty" "career\|certification"; do
            count=$(find citadel-content/blog articles -name "*.md" 2>/dev/null | xargs grep -ril "$pillar" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              gaps="${gaps}${pillar} "
            fi
          done
          if [ -n "$gaps" ]; then
            echo "pillar_gaps=$gaps" >> $GITHUB_OUTPUT
            echo "Pillar gaps detected: $gaps"
          else
            echo "pillar_gaps=" >> $GITHUB_OUTPUT
            echo "All pillars covered"
          fi

      - name: Update GROWTH-DASHBOARD.md
        run: |
          DATE=${{ steps.metrics.outputs.date }}

          sed -i "s|> Auto-updated by the daily monitor.*|> Auto-updated by the daily monitor at 3:47pm CDT. Last updated: $DATE|" \
            automation/content-engine/GROWTH-DASHBOARD.md || true

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add automation/content-engine/GROWTH-DASHBOARD.md
          git diff --cached --quiet || git commit -m "chore: daily monitor update [$DATE]"
          git push origin HEAD

      - name: Send daily email report
        if: ${{ inputs.send_email != 'false' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DATE=${{ steps.metrics.outputs.date }}
          BLOG_COUNT=${{ steps.metrics.outputs.blog_count }}
          PIPELINE_COUNT=${{ steps.metrics.outputs.pipeline_count }}
          SOCIAL_COUNT=${{ steps.metrics.outputs.social_count }}
          TOTAL=${{ steps.metrics.outputs.total_articles }}

          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set — skipping email"
            exit 0
          fi

          STATUS_ICON="BEHIND TARGET"
          [ "$TOTAL" -ge 100 ] && STATUS_ICON="ON TRACK"

          curl -sf -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"from\": \"Citadel Growth Monitor <onboarding@resend.dev>\",
              \"to\": [\"citadelcloudmanagement@gmail.com\"],
              \"subject\": \"[Citadel Growth] Daily Report - $DATE\",
              \"html\": \"<h2>Citadel Cloud Management Growth Report</h2><p><strong>Date:</strong> $DATE CDT</p><h3>Metrics</h3><table border=1 cellpadding=8><tr><th>Metric</th><th>Value</th><th>Target</th></tr><tr><td>Blog Articles</td><td>$BLOG_COUNT</td><td>100</td></tr><tr><td>Pipeline Articles</td><td>$PIPELINE_COUNT</td><td>20</td></tr><tr><td>Social Batches</td><td>$SOCIAL_COUNT</td><td>10</td></tr><tr><td><strong>Total</strong></td><td><strong>$TOTAL</strong></td><td><strong>100</strong></td></tr></table><p>Status: $STATUS_ICON</p><p><a href='https://github.com/kogunlowo123/citadel-cloud-management'>View Repository</a></p>\"
            }" && echo "Email sent" || echo "Email failed — check RESEND_API_KEY and api.resend.com allowlist"

  alert-p0-gaps:
    name: Alert on P0 Content Gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: daily-monitor
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Create issue if article count critically low
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(find citadel-content/blog articles -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "Total articles: $TOTAL"

          if [ "$TOTAL" -lt 50 ]; then
            # Check for existing open P0 issue by title pattern (no label dependency)
            existing=$(gh issue list --state open --search "P0: Article count" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$existing" ]; then
              gh issue create \
                --title "P0: Article count ($TOTAL) below 50 — accelerate content production" \
                --body "The content pipeline has **$TOTAL articles** against a target of 100. This is a P0 gap. Action: produce 5 articles this week covering pillar gaps." \
                && echo "P0 issue created" || echo "Could not create issue (non-fatal)"
            else
              echo "P0 issue #$existing already open — skipping"
            fi
          else
            echo "Article count ($TOTAL) above 50 threshold — no issue needed"
          fi
