name: Dev.to Account Setup — Stage 1 (Signup)

on:
  workflow_dispatch:

jobs:
  signup:
    name: Create Dev.to Account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write package.json and signup script
        run: |
          mkdir -p /tmp/devto-work

          cat > /tmp/devto-work/package.json << 'EOF'
          {"name":"devto-setup","version":"1.0.0","dependencies":{"playwright":"1.44.0"}}
          EOF

          cat > /tmp/devto-work/signup.js << 'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const LOG = [];
          const log = msg => { console.log(msg); LOG.push(msg); };

          (async () => {
            const chromePath = process.env.CHROME_EXEC || '';
            log('Chrome path: ' + chromePath);
            log('Launching browser...');
            const launchOpts = {
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            };
            if (chromePath) launchOpts.executablePath = chromePath;
            const browser = await chromium.launch(launchOpts);
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
            });

            log('Navigating to dev.to...');
            await page.goto('https://dev.to/enter?state=new-user', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.screenshot({ path: '/tmp/devto_01_landing.png' });
            log('URL: ' + page.url());
            log('Title: ' + await page.title());

            const bodyText = await page.textContent('body').catch(() => '');
            log('Body (first 800 chars):\n' + bodyText.substring(0, 800));

            const inputs = await page.$$eval('input', els =>
              els.map(e => 'type=' + e.type + ' id=' + e.id + ' name=' + e.name + ' ph="' + e.placeholder + '" visible=' + (e.offsetParent !== null)));
            log('Inputs:\n  ' + inputs.join('\n  '));

            const buttons = await page.$$eval('button', els => els.map(e => e.textContent.trim().substring(0, 60) + ' visible=' + (e.offsetParent !== null)));
            log('Buttons:\n  ' + buttons.slice(0, 15).join('\n  '));

            // Use JS click to bypass visibility for any email toggle
            const clickedToggle = await page.evaluate(() => {
              const els = [...document.querySelectorAll('button, a, [role="tab"]')];
              const emailEl = els.find(e => e.textContent.includes('email') || e.textContent.includes('Email'));
              if (emailEl) { emailEl.click(); return emailEl.textContent.trim(); }
              return null;
            });
            log('JS-clicked toggle: ' + JSON.stringify(clickedToggle));
            await page.waitForTimeout(1500);
            await page.screenshot({ path: '/tmp/devto_02_after_toggle.png' });

            // Log inputs again after toggle
            const inputs2 = await page.$$eval('input', els =>
              els.map(e => 'type=' + e.type + ' id=' + e.id + ' name=' + e.name + ' vis=' + (e.offsetParent !== null)));
            log('Inputs after toggle:\n  ' + inputs2.join('\n  '));

            // Fill form using JS directly (bypasses visibility constraints)
            const filled = await page.evaluate(({ email, password }) => {
              const result = {};
              // Email field
              const emailEl = document.querySelector('#user_email, input[name="user[email]"], input[type="email"]');
              if (emailEl) {
                const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                nativeSetter.call(emailEl, email);
                emailEl.dispatchEvent(new Event('input', { bubbles: true }));
                emailEl.dispatchEvent(new Event('change', { bubbles: true }));
                result.emailFilled = true;
                result.emailId = emailEl.id;
              }
              // Password field
              const pwEl = document.querySelector('#user_password, input[name="user[password]"], input[type="password"]');
              if (pwEl) {
                const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                nativeSetter.call(pwEl, password);
                pwEl.dispatchEvent(new Event('input', { bubbles: true }));
                pwEl.dispatchEvent(new Event('change', { bubbles: true }));
                result.pwFilled = true;
              }
              // Name
              const nameEl = document.querySelector('#user_name, input[name="user[name]"]');
              if (nameEl) {
                const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                nativeSetter.call(nameEl, 'Citadel Cloud Management');
                nameEl.dispatchEvent(new Event('input', { bubbles: true }));
                result.nameFilled = true;
              }
              // Username
              const userEl = document.querySelector('#user_username, input[name="user[username]"]');
              if (userEl) {
                const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                nativeSetter.call(userEl, 'citadelcloud');
                userEl.dispatchEvent(new Event('input', { bubbles: true }));
                result.usernameFilled = true;
              }
              return result;
            }, { email: 'citadelcloudmanagement@gmail.com', password: process.env.DEVTO_PASSWORD });

            log('Form fill result: ' + JSON.stringify(filled));
            await page.screenshot({ path: '/tmp/devto_03_filled.png' });

            if (filled.emailFilled || filled.pwFilled) {
              // Submit via JS
              const submitted = await page.evaluate(() => {
                const submitEl = document.querySelector('button[type="submit"], input[type="submit"], button[data-testid*="submit"]');
                if (submitEl) { submitEl.click(); return submitEl.textContent.trim() || 'submitted'; }
                // Try form submit
                const form = document.querySelector('form');
                if (form) { form.submit(); return 'form.submit()'; }
                return null;
              });
              log('Submit result: ' + submitted);

              await page.waitForTimeout(5000);
              await page.screenshot({ path: '/tmp/devto_04_after_submit.png' });

              const afterUrl  = page.url();
              const afterText = await page.textContent('body').catch(() => '');
              log('After URL: ' + afterUrl);
              log('After text (500 chars): ' + afterText.substring(0, 500));
              const lower = afterText.toLowerCase();

              if (lower.includes('check your email') || lower.includes('verify') || lower.includes('confirmation') || lower.includes('sent'))
                log('OUTCOME=SUCCESS_EMAIL_SENT');
              else if (lower.includes('taken') || lower.includes('already been'))
                log('OUTCOME=ALREADY_EXISTS: ' + afterText.substring(0, 400));
              else if (afterUrl.includes('/dashboard') || afterUrl === 'https://dev.to/')
                log('OUTCOME=DIRECT_LOGIN');
              else
                log('OUTCOME=UNKNOWN url=' + afterUrl + ' text=' + afterText.substring(0, 600));
            } else {
              log('OUTCOME=NO_FORM_FOUND — form fill returned: ' + JSON.stringify(filled));
              log('Full page HTML (3000 chars):\n' + await page.content().then(h => h.substring(0, 3000)));
            }

            await browser.close();
            fs.writeFileSync('/tmp/devto_result.txt', LOG.join('\n'));
          })().catch(err => {
            const msg = 'FATAL: ' + err.message + '\n' + err.stack;
            console.error(msg);
            require('fs').appendFileSync('/tmp/devto_result.txt', '\n' + msg);
            process.exit(1);
          });
          JSEOF

      - name: Install Chrome and Playwright package
        run: |
          # Use system Chrome from GitHub Actions runner (already installed)
          # Install wget + Chrome if not present
          which google-chrome-stable 2>/dev/null || \
          (wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - && \
           echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list && \
           sudo apt-get update -qq && sudo apt-get install -y google-chrome-stable 2>&1 | tail -3)

          CHROME_PATH=$(which google-chrome-stable || which google-chrome || which chromium-browser || echo "")
          echo "Chrome path: $CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> $GITHUB_ENV

          # Install playwright npm package WITHOUT downloading its own browser
          cd /tmp/devto-work
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install 2>&1 | tail -3
          echo "Playwright npm installed"

      - name: Run signup script
        id: signup
        run: |
          cd /tmp/devto-work
          node signup.js
          RC=$?
          echo "--- RESULT ---"
          cat /tmp/devto_result.txt
          exit $RC
        env:
          DEVTO_PASSWORD: ${{ secrets.DEVTO_PASSWORD }}
          CHROME_EXEC: ${{ env.CHROME_PATH }}

      - name: Commit result to repo
        if: always()
        run: |
          RESULT=$(cat /tmp/devto_result.txt 2>/dev/null || echo "No result file — script crashed before writing")
          RESULT_B64=$(echo "$RESULT" | base64 -w0)

          # Get SHA of existing file if it exists
          SHA=$(curl -s --noproxy "api.github.com" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/automation/content-engine/devto-signup-result.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || true)

          PAYLOAD="{\"message\":\"ci: devto signup result [skip ci]\",\"content\":\"${RESULT_B64}\",\"branch\":\"main\""
          [ -n "$SHA" ] && PAYLOAD="${PAYLOAD},\"sha\":\"${SHA}\""
          PAYLOAD="${PAYLOAD}}"

          curl -s --noproxy "api.github.com" \
            -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/automation/content-engine/devto-signup-result.txt" \
            -d "$PAYLOAD" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Committed' if 'commit' in d else 'Error: '+str(d.get('message','')))"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devto-signup-screenshots
          path: /tmp/devto_*.png
          if-no-files-found: warn
          retention-days: 3
