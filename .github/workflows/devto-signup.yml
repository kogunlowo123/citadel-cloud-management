name: Dev.to Account Setup — Stage 1 (Signup)

on:
  workflow_dispatch:

jobs:
  signup:
    name: Create Dev.to Account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write package.json and signup script
        run: |
          mkdir -p /tmp/devto-work

          cat > /tmp/devto-work/package.json << 'EOF'
          {"name":"devto-setup","version":"1.0.0","dependencies":{"playwright":"1.44.0"}}
          EOF

          cat > /tmp/devto-work/signup.js << 'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const LOG = [];
          const log = msg => { console.log(msg); LOG.push(msg); };

          (async () => {
            log('Launching Chromium...');
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
            });

            log('Navigating to dev.to...');
            await page.goto('https://dev.to/enter?state=new-user', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.screenshot({ path: '/tmp/devto_01_landing.png' });
            log('URL: ' + page.url());
            log('Title: ' + await page.title());

            const bodyText = await page.textContent('body').catch(() => '');
            const inputs = await page.$$eval('input', els =>
              els.map(e => 'type=' + e.type + ' id=' + e.id + ' name=' + e.name + ' ph="' + e.placeholder + '"'));
            log('Inputs:\n  ' + inputs.join('\n  '));

            const buttons = await page.$$eval('button', els => els.map(e => e.textContent.trim().substring(0, 60)));
            log('Buttons: ' + JSON.stringify(buttons.slice(0, 10)));

            // Click email signup toggle if present
            const emailToggle = await page.$('button:has-text("Sign up with email"), a:has-text("Sign up with email")');
            if (emailToggle) {
              log('Clicking email signup toggle...');
              await emailToggle.click();
              await page.waitForTimeout(1000);
            }

            const nameInput     = await page.$('#user_name, input[name="user[name]"]');
            const usernameInput = await page.$('#user_username, input[name="user[username]"]');
            const emailInput    = await page.$('#user_email, input[name="user[email]"], input[type="email"]');
            const pwInput       = await page.$('#user_password, input[name="user[password]"], input[type="password"]');

            log('Fields found: name=' + !!nameInput + ' username=' + !!usernameInput + ' email=' + !!emailInput + ' pw=' + !!pwInput);

            if (emailInput && pwInput) {
              if (nameInput) { await nameInput.fill('Citadel Cloud Management'); log('Filled name'); }
              if (usernameInput) { await usernameInput.fill('citadelcloud'); log('Filled username'); }
              await emailInput.fill('citadelcloudmanagement@gmail.com');
              await pwInput.fill(process.env.DEVTO_PASSWORD);
              log('Filled email + password');
              await page.screenshot({ path: '/tmp/devto_02_filled.png' });

              const submitBtn = await page.$('button[type="submit"], button:has-text("Sign up"), button:has-text("Create account"), input[type="submit"]');
              if (submitBtn) {
                log('Clicking: ' + (await submitBtn.textContent()).trim());
                await submitBtn.click();
              } else { log('WARNING: No submit button found'); }

              await page.waitForTimeout(4000);
              await page.screenshot({ path: '/tmp/devto_03_after.png' });

              const afterUrl  = page.url();
              const afterText = await page.textContent('body').catch(() => '');
              log('After URL: ' + afterUrl);
              const lower = afterText.toLowerCase();

              if (lower.includes('check your email') || lower.includes('verify') || lower.includes('confirmation'))
                log('OUTCOME=SUCCESS_EMAIL_SENT');
              else if (lower.includes('taken') || lower.includes('already'))
                log('OUTCOME=ALREADY_EXISTS:' + afterText.substring(0, 300));
              else if (afterUrl.includes('dashboard') || afterUrl === 'https://dev.to/')
                log('OUTCOME=DIRECT_LOGIN');
              else
                log('OUTCOME=UNKNOWN url=' + afterUrl + ' text=' + afterText.substring(0, 500));
            } else {
              log('OUTCOME=NO_FORM_FOUND');
              log('Page body (1500 chars):\n' + bodyText.substring(0, 1500));
            }

            await browser.close();
            fs.writeFileSync('/tmp/devto_result.txt', LOG.join('\n'));
          })().catch(err => {
            const msg = 'FATAL: ' + err.message + '\n' + err.stack;
            console.error(msg);
            require('fs').appendFileSync('/tmp/devto_result.txt', '\n' + msg);
            process.exit(1);
          });
          JSEOF

      - name: Install Playwright dependencies
        run: |
          cd /tmp/devto-work
          npm install 2>&1 | tail -3
          echo "Installing Chromium..."
          # Use the local binary path explicitly to avoid version mismatch
          node_modules/.bin/playwright install --with-deps chromium
          echo "Chromium installed at:"
          find /home/runner/.cache/ms-playwright /root/.cache/ms-playwright -name 'chrome' 2>/dev/null | head -1

      - name: Run signup script
        id: signup
        run: |
          cd /tmp/devto-work
          node signup.js
          RC=$?
          echo "--- RESULT ---"
          cat /tmp/devto_result.txt
          exit $RC
        env:
          DEVTO_PASSWORD: ${{ secrets.DEVTO_PASSWORD }}

      - name: Commit result to repo
        if: always()
        run: |
          RESULT=$(cat /tmp/devto_result.txt 2>/dev/null || echo "No result file — script crashed before writing")
          RESULT_B64=$(echo "$RESULT" | base64 -w0)

          # Get SHA of existing file if it exists
          SHA=$(curl -s --noproxy "api.github.com" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/automation/content-engine/devto-signup-result.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || true)

          PAYLOAD="{\"message\":\"ci: devto signup result [skip ci]\",\"content\":\"${RESULT_B64}\",\"branch\":\"main\""
          [ -n "$SHA" ] && PAYLOAD="${PAYLOAD},\"sha\":\"${SHA}\""
          PAYLOAD="${PAYLOAD}}"

          curl -s --noproxy "api.github.com" \
            -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/automation/content-engine/devto-signup-result.txt" \
            -d "$PAYLOAD" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Committed' if 'commit' in d else 'Error: '+str(d.get('message','')))"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devto-signup-screenshots
          path: /tmp/devto_*.png
          if-no-files-found: warn
          retention-days: 3
