name: Content Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'citadel-content/blog/**'
      - 'articles/**'
  pull_request:
    branches: [main]
    paths:
      - 'citadel-content/blog/**'
      - 'articles/**'
  schedule:
    # Daily content health check at 3:47pm CDT (20:47 UTC)
    - cron: '47 20 * * *'
  workflow_dispatch:

jobs:
  content-audit:
    name: Content Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count articles
        id: count
        run: |
          BLOG_COUNT=$(find citadel-content/blog -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          PIPELINE_COUNT=$(find articles -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          SOCIAL_COUNT=$(find citadel-content/social-media -name "distribution-batch-*.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "blog_count=$BLOG_COUNT" >> $GITHUB_OUTPUT
          echo "pipeline_count=$PIPELINE_COUNT" >> $GITHUB_OUTPUT
          echo "social_count=$SOCIAL_COUNT" >> $GITHUB_OUTPUT
          echo "## Content Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Blog articles | $BLOG_COUNT | 100 |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline articles | $PIPELINE_COUNT | 20 |" >> $GITHUB_STEP_SUMMARY
          echo "| Social batches | $SOCIAL_COUNT | 10 |" >> $GITHUB_STEP_SUMMARY

      - name: Check pillar coverage
        run: |
          echo "## Pillar Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Pillar | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          for pillar in "aws\|eks\|vpc\|rds\|lambda\|cloudfront" "azure\|aks\|key.vault" "gke\|gcp\|vertex\|cloud.run" "mcp" "multi-cloud\|landing.zone" "bedrock\|ai\|agent\|llm\|rag" "security\|waf\|guardduty\|devsecops" "career\|certification"; do
            count=$(find citadel-content/blog articles -name "*.md" 2>/dev/null | xargs grep -ril "$pillar" 2>/dev/null | wc -l | tr -d ' ')
            echo "| $pillar | $count |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Validate markdown
        run: |
          error_count=0
          while IFS= read -r -d '' f; do
            if ! grep -q "^# " "$f"; then
              echo "::warning file=$f::Missing H1 heading"
              error_count=$((error_count + 1))
            fi
          done < <(find citadel-content/blog -name "*.md" -print0 2>/dev/null)
          echo "Markdown validation complete. Warnings: $error_count"

      - name: Update dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          BLOG_COUNT=${{ steps.count.outputs.blog_count }}
          DATE=$(date -u +%Y-%m-%d)

          sed -i "s|> Auto-updated by the daily monitor.*|> Auto-updated by the daily monitor at 3:47pm CDT. Last updated: $DATE|" \
            automation/content-engine/GROWTH-DASHBOARD.md || true

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add automation/content-engine/GROWTH-DASHBOARD.md
          git diff --cached --quiet || git commit -m "chore: auto-update growth dashboard [$DATE]"
          git push origin HEAD

  seo-check:
    name: SEO Metadata Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SEO metadata presence
        run: |
          passed=0
          warned=0
          while IFS= read -r -d '' f; do
            has_pillar=0
            has_seo=0
            grep -q "Pillar:" "$f" && has_pillar=1 || true
            grep -q "SEO Target:" "$f" && has_seo=1 || true
            if [ "$has_pillar" -eq 1 ] && [ "$has_seo" -eq 1 ]; then
              passed=$((passed + 1))
            else
              warned=$((warned + 1))
              echo "::warning file=$f::Missing SEO metadata (Pillar or SEO Target)"
            fi
          done < <(find citadel-content/blog -name "*.md" -print0 2>/dev/null)
          echo "SEO check: $passed passed, $warned need metadata"
          echo "## SEO Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- Articles with full metadata: $passed" >> $GITHUB_STEP_SUMMARY
          echo "- Articles missing metadata: $warned" >> $GITHUB_STEP_SUMMARY
